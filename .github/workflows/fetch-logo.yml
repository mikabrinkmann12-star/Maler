name: Logo von Live-Website holen
on:
  push:
    branches:
      - claude/website-code-access-3gy8v9
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Logo herunterladen und committen
        run: |
          if [ -f assets/logo/logo.gif ]; then
            echo "Logo ist bereits vorhanden — nichts zu tun."
            exit 0
          fi
          mkdir -p assets/logo
          curl -fsSL "https://coruscating-strudel-f2283c.netlify.app/assets/logo/logo.gif" -o assets/logo/logo.gif
          file assets/logo/logo.gif
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logo/logo.gif
          git commit -m "Logo von der Live-Website übernehmen"
          git push
