name: Logo von Live-Website holen
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Logo herunterladen
        run: |
          mkdir -p assets/logo
          curl -fsSL "https://coruscating-strudel-f2283c.netlify.app/assets/logo/logo.gif" -o assets/logo/logo.gif
          file assets/logo/logo.gif
      - name: Logo committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logo/logo.gif
          git commit -m "Logo von der Live-Website übernehmen"
          git push
